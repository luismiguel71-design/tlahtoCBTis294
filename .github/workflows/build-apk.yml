name: Generar APK de Android (Vozzy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar assets y proyecto Android con Capacitor
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        working-directory: apps/mobile
        run: |
          node sync-www.js
          npm ci
          npx cap telemetry off
          npx cap add android
          npx cap sync android

      - name: Dar permisos de ejecucion a Gradlew
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew

      - name: Compilar APK Debug con Gradle
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: Vozzy-Android-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
