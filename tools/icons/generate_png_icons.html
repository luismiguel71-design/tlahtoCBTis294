<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador de Iconos Vozzy</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        .canvas-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; font-size: 14px; }
        #status { font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #008000; }
    </style>
</head>
<body>
    <h1>Generador de Iconos PWA Vozzy</h1>
    <div id="status">Generando iconos...</div>
    <div class="canvas-container" id="container"></div>

    <script>
        const sizes = [
            { name: 'icon-192.png', width: 192, height: 192, circleRatio: 0.78 },
            { name: 'icon-512.png', width: 512, height: 512, circleRatio: 0.78 },
            { name: 'icon-maskable-512.png', width: 512, height: 512, circleRatio: 0.72 },
            { name: 'apple-touch-icon.png', width: 180, height: 180, circleRatio: 0.78 },
            { name: 'favicon.png', width: 32, height: 32, circleRatio: 0.82 }
        ];

        function drawVozzyIcon(canvas, width, height, circleRatio) {
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Pure white background
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, width, height);

            // Central solid black circle
            const cx = width / 2;
            const cy = height / 2;
            const radius = (Math.min(width, height) / 2) * circleRatio;

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // Line microphone in white stroke
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = Math.max(1.8, width * 0.035);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Mic capsule
            const capW = width * 0.16;
            const capH = height * 0.28;
            const capX = cx - capW / 2;
            const capY = cy - capH / 2 - height * 0.05;
            const capR = capW / 2;

            ctx.beginPath();
            ctx.roundRect(capX, capY, capW, capH, capR);
            ctx.stroke();

            // Mic holder arc
            const arcR = width * 0.168;
            ctx.beginPath();
            ctx.arc(cx, cy - height * 0.01, arcR, 0, Math.PI, false);
            ctx.stroke();

            // Mic stem
            const stemY1 = cy - height * 0.01 + arcR;
            const stemY2 = stemY1 + height * 0.085;
            ctx.beginPath();
            ctx.moveTo(cx, stemY1);
            ctx.lineTo(cx, stemY2);
            ctx.stroke();

            // Mic base horizontal line
            const baseW = width * 0.18;
            ctx.beginPath();
            ctx.moveTo(cx - baseW / 2, stemY2);
            ctx.lineTo(cx + baseW / 2, stemY2);
            ctx.stroke();
        }

        async function generateAndSaveAll() {
            const container = document.getElementById('container');
            const status = document.getElementById('status');

            for (const item of sizes) {
                const card = document.createElement('div');
                card.className = 'card';
                const title = document.createElement('h3');
                title.textContent = `${item.name} (${item.width}x${item.height})`;
                const canvas = document.createElement('canvas');

                drawVozzyIcon(canvas, item.width, item.height, item.circleRatio);

                card.appendChild(title);
                card.appendChild(canvas);
                container.appendChild(card);

                const dataUrl = canvas.toDataURL('image/png');
                try {
                    const res = await fetch('http://localhost:8099/save-icon', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: item.name, dataUrl })
                    });
                    const data = await res.json();
                    console.log('Saved:', data);
                } catch (e) {
                    console.error('Error saving ' + item.name, e);
                }
            }
            status.textContent = '¡Todos los iconos PNG fueron generados y guardados exitosamente!';
        }

        window.onload = generateAndSaveAll;
    </script>
</body>
</html>
